name: Update Google Search Status data

on:
  schedule:
    - cron: "17 */6 * * *" # 6時間ごと
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python search-status/fetch_status.py
      - name: Commit if changed
        run: |
          git add search-status/data
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update Google Search Status data"
          git push
